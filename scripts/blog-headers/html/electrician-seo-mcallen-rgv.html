<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background-color: #0f172a;
    background-image: radial-gradient(circle at 1px 1px, rgba(59,130,246,0.22) 1px, transparent 0);
    background-size: 32px 32px;
    position: relative;
  }
  .glow {
    position: absolute;
    top: -140px;
    right: -140px;
    width: 620px;
    height: 620px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(29, 78, 216, 0.45) 0%, transparent 70%);
    filter: blur(10px);
  }
  .motif {
    position: absolute;
    right: 20px;
    bottom: -20px;
    opacity: 0.9;
  }
  .content {
    position: relative;
    z-index: 2;
    padding: 72px 64px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    width: fit-content;
    padding: 9px 20px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    border: 1px solid #1d4ed866;
    color: #3b82f6;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%; background: #1d4ed8;
  }
  h1 {
    color: #ffffff;
    font-weight: 900;
    font-size: 44px;
    line-height: 1.14;
    max-width: 600px;
    letter-spacing: -0.01em;
  }
  .footer {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    font-weight: 900;
    font-size: 24px;
    color: #ffffff;
  }
  .logo span { color: #3b82f6; }
  .tagline {
    color: rgba(255,255,255,0.55);
    font-size: 16px;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="motif">
    <svg width="520" height="520" viewBox="0 0 520 520" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="260" cy="260" r="180" stroke="#3b82f6" stroke-opacity="0.18" stroke-width="1.5"/>
      <circle cx="260" cy="260" r="130" stroke="#3b82f6" stroke-opacity="0.14" stroke-width="1.5"/>
      <g transform="translate(180,140)">
        <path d="M80 0C35.8 0 0 35.8 0 80c0 60 80 140 80 140s80-80 80-140C160 35.8 124.2 0 80 0z" fill="#1d4ed8" fill-opacity="0.9"/>
        <circle cx="80" cy="80" r="34" fill="#0f172a"/>
      </g>
      <g stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55">
        <path d="M300 150 Q330 120 300 90"/>
        <path d="M325 175 Q370 120 325 65"/>
      </g>
    </svg>
    </div>
  <div class="content">
    <div class="badge"><span class="dot"></span>Local SEO</div>
    <h1>Electrician SEO: How to Get More Calls in McAllen and the RGV</h1>
    <div class="footer">
      <div class="logo">Rank<span>RGV</span></div>
      <div class="tagline">rankrgv.com</div>
    </div>
  </div>
</body>
</html>
