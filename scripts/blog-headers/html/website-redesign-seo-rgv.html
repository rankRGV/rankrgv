<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background-color: #0f172a;
    background-image: radial-gradient(circle at 1px 1px, rgba(59,130,246,0.22) 1px, transparent 0);
    background-size: 32px 32px;
    position: relative;
  }
  .glow {
    position: absolute;
    top: -140px;
    right: -140px;
    width: 620px;
    height: 620px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124, 58, 237, 0.45) 0%, transparent 70%);
    filter: blur(10px);
  }
  .motif {
    position: absolute;
    right: 20px;
    bottom: -20px;
    opacity: 0.9;
  }
  .content {
    position: relative;
    z-index: 2;
    padding: 72px 64px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    width: fit-content;
    padding: 9px 20px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    border: 1px solid #7c3aed66;
    color: #a78bfa;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%; background: #7c3aed;
  }
  h1 {
    color: #ffffff;
    font-weight: 900;
    font-size: 44px;
    line-height: 1.14;
    max-width: 600px;
    letter-spacing: -0.01em;
  }
  .footer {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    font-weight: 900;
    font-size: 24px;
    color: #ffffff;
  }
  .logo span { color: #a78bfa; }
  .tagline {
    color: rgba(255,255,255,0.55);
    font-size: 16px;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="motif">
    <svg width="540" height="460" viewBox="0 0 540 460" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="10" width="480" height="340" rx="16" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="2"/>
      <rect x="10" y="10" width="480" height="44" rx="16" fill="#7c3aed" fill-opacity="0.18"/>
      <circle cx="34" cy="32" r="6" fill="#a78bfa" fill-opacity="0.6"/>
      <circle cx="54" cy="32" r="6" fill="#a78bfa" fill-opacity="0.4"/>
      <circle cx="74" cy="32" r="6" fill="#a78bfa" fill-opacity="0.25"/>
      <rect x="34" y="80" width="180" height="18" rx="4" fill="#7c3aed" fill-opacity="0.85"/>
      <rect x="34" y="112" width="280" height="10" rx="3" fill="#a78bfa" fill-opacity="0.35"/>
      <rect x="34" y="132" width="240" height="10" rx="3" fill="#a78bfa" fill-opacity="0.35"/>
      <rect x="34" y="168" width="120" height="40" rx="8" fill="#7c3aed"/>
      <rect x="330" y="80" width="140" height="140" rx="10" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.3"/>
    </svg>
    </div>
  <div class="content">
    <div class="badge"><span class="dot"></span>Web Design</div>
    <h1>RGV Website Redesigns That Actually Improve Local SEO</h1>
    <div class="footer">
      <div class="logo">Rank<span>RGV</span></div>
      <div class="tagline">rankrgv.com</div>
    </div>
  </div>
</body>
</html>
